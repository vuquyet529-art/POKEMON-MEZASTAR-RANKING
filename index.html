<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon MEZASTAR - Bảng Xếp Hạng Trực Tiếp</title>
    <!-- Google Fonts: Be Vietnam Pro & Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --mezastar-gold: #FFC700;
            --mezastar-red: #E60012;
            --mezastar-blue: #0066FF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --bg-card: rgba(255, 255, 255, 0.92);
            --border-light: rgba(226, 232, 240, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzC6ueBP_oaNDrJQnZPwNg4H9tABqWlItxNSfT3854YTZQ9Tfoe8ap_n_H&s=10');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f8fafc;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HEADER & LOGO */
        header {
            text-align: center;
            padding: 15px 0 10px;
        }

        .logo-wrapper {
            display: inline-block;
            margin-bottom: 8px;
        }

        .mezastar-logo {
            max-width: 380px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.25));
            transition: transform 0.3s ease;
        }

        .mezastar-logo:hover {
            transform: scale(1.02);
        }

        .subtitle-badge {
            display: inline-block;
            background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%);
            color: #FFFFFF;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 8px 24px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.4);
            margin-top: 5px;
        }

        /* STATUS BAR */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            padding: 14px 28px;
            border-radius: 50px;
            margin: 25px 0 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--mezastar-red);
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background-color: var(--mezastar-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--mezastar-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(230, 0, 18, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(230, 0, 18, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(230, 0, 18, 0); }
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border-radius: 20px;
            border: 1px solid #CBD5E1;
            background: #FFFFFF;
            color: var(--text-dark);
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--mezastar-blue);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* PODIUM TOP 3 */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .top-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            position: relative;
            border: 2px solid transparent;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            width: 300px;
        }

        .top-card.rank-1 {
            border-color: #FFB800;
            background: linear-gradient(180deg, rgba(255, 248, 225, 0.95) 0%, rgba(255, 255, 255, 0.95) 100%);
            box-shadow: 0 15px 30px -5px rgba(255, 184, 0, 0.3);
            order: 2;
            transform: scale(1.06);
        }

        .top-card.rank-2 {
            border-color: #94A3B8;
            order: 1;
        }

        .top-card.rank-3 {
            border-color: #D97706;
            order: 3;
        }

        .crown-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .rank-1 .crown-icon { color: #FFB800; }
        .rank-2 .crown-icon { color: #94A3B8; }
        .rank-3 .crown-icon { color: #D97706; }

        .team-names {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .trainer-ids {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .top-score {
            font-family: 'Orbitron', 'Be Vietnam Pro', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #D97706;
        }

        .rank-1 .top-score {
            color: #B45309;
        }

        /* LEADERBOARD TABLE */
        .table-container {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #0F172A;
            font-family: 'Be Vietnam Pro', sans-serif;
            color: #FFD700;
            padding: 18px 16px;
            font-size: 0.88rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #E2E8F0;
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(241, 245, 249, 0.8);
        }

        .rank-badge {
            font-family: 'Orbitron', 'Be Vietnam Pro', sans-serif;
            font-weight: 800;
            display: inline-block;
            width: 36px;
            height: 36px;
            line-height: 36px;
            text-align: center;
            border-radius: 50%;
            background: #F1F5F9;
            color: var(--text-dark);
        }

        .rank-1-badge { background: #FFB800; color: #FFFFFF; box-shadow: 0 4px 10px rgba(255, 184, 0, 0.4); }
        .rank-2-badge { background: #94A3B8; color: #FFFFFF; }
        .rank-3-badge { background: #D97706; color: #FFFFFF; }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-weight: 700;
            color: var(--text-dark);
        }

        .trainer-id {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .time-badge {
            background: #E0F2FE;
            color: #0284C7;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .score-val {
            font-family: 'Orbitron', 'Be Vietnam Pro', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #B45309;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--mezastar-blue);
        }

        @media (max-width: 768px) {
            .podium-container { flex-direction: column; align-items: center; }
            .top-card.rank-1 { order: 1; transform: scale(1); }
            .top-card.rank-2 { order: 2; }
            .top-card.rank-3 { order: 3; }
            .status-bar { flex-direction: column; gap: 15px; border-radius: 20px; }
            .search-box { width: 100%; }
            .mezastar-logo { max-width: 280px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER WITH MEZASTAR LOGO -->
        <header>
            <div class="logo-wrapper">
                <img src="logo.png" id="mainLogo" class="mezastar-logo" alt="Pokémon MEZASTAR" onerror="this.onerror=null; this.src='sample_my_Hellomezastar_logo.png';">
            </div>
            <div>
                <span class="subtitle-badge"><i class="fa-solid fa-trophy"></i> Bảng Xếp Hạng Tag Battle Challenge</span>
            </div>
        </header>

        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="live-badge">
                <div class="pulse-dot"></div>
                <span>Trực Tiếp • Cập nhật tự động</span>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm tên người chơi hoặc Trainer ID..." onkeyup="filterLeaderboard()">
            </div>
            <div id="lastUpdated" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">
                Đang kết nối...
            </div>
        </div>

        <!-- TOP 3 PODIUM -->
        <div class="podium-container" id="podium"></div>

        <!-- FULL LEADERBOARD TABLE -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px; text-align: center;">HẠNG</th>
                        <th>NGƯỜI CHƠI 1</th>
                        <th>NGƯỜI CHƠI 2</th>
                        <th style="width: 140px;">KHUNG GIỜ</th>
                        <th style="width: 150px; text-align: right;">ĐIỂM SỐ</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr>
                        <td colspan="5" class="loading">
                            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải bảng xếp hạng...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = '1y8gL7yJTViGX33N5PO0ggpXG94uEPVdjFkBQDNh7b54';
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;

        let rawLeaderboardData = [];

        function formatSheetTime(cell) {
            if (!cell) return '-';
            if (cell.f) return cell.f;
            
            const val = cell.v;
            if (!val) return '-';

            if (typeof val === 'string') {
                const dateMatch = val.match(/Date\(\d+,\d+,\d+,(\d+),(\d+)/);
                if (dateMatch) {
                    const hours = dateMatch[1].padStart(2, '0');
                    const mins = dateMatch[2].padStart(2, '0');
                    return `${hours}:${mins}`;
                }
                return val;
            }
            return String(val);
        }

        async function fetchRankingData() {
            try {
                const response = await fetch(GVIZ_URL);
                const text = await response.text();
                
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                
                const rows = data.table.rows;
                let parsedData = [];

                rows.forEach(row => {
                    const cells = row.c;
                    if (!cells) return;

                    const p1 = cells[1] ? (cells[1].v || '') : '';
                    const id1 = cells[2] ? (cells[2].v || '') : '';
                    const p2 = cells[3] ? (cells[3].v || '') : '';
                    const id2 = cells[4] ? (cells[4].v || '') : '';
                    const time = formatSheetTime(cells[5]);
                    const scoreRaw = cells[6] ? cells[6].v : 0;
                    const score = parseFloat(scoreRaw) || 0;

                    if (p1.toString().trim() !== '' || p2.toString().trim() !== '') {
                        parsedData.push({ p1, id1, p2, id2, time, score });
                    }
                });

                // TỰ ĐỘNG SẮP XẾP THEO ĐIỂM SỐ GIẢM DẦN
                parsedData.sort((a, b) => b.score - a.score);

                // ĐÁNH RANK TỰ ĐỘNG
                parsedData.forEach((item, index) => {
                    item.rank = index + 1;
                });

                rawLeaderboardData = parsedData;
                renderPodium(parsedData.slice(0, 3));
                renderLeaderboard(parsedData);
                
                const now = new Date();
                document.getElementById('lastUpdated').innerText = `Cập nhật: ${now.toLocaleTimeString('vi-VN')}`;

            } catch (error) {
                console.error("Lỗi kết nối Google Sheet:", error);
            }
        }

        function renderPodium(top3) {
            const podiumEl = document.getElementById('podium');
            if (!top3 || top3.length === 0) {
                podiumEl.innerHTML = '';
                return;
            }

            let html = '';
            const crowns = ['fa-crown', 'fa-medal', 'fa-award'];
            const classes = ['rank-1', 'rank-2', 'rank-3'];
            const displayOrder = [1, 0, 2];

            displayOrder.forEach(idx => {
                if (top3[idx]) {
                    const item = top3[idx];
                    html += `
                        <div class="top-card ${classes[idx]}">
                            <i class="fa-solid ${crowns[idx]} crown-icon"></i>
                            <div style="font-family: 'Be Vietnam Pro'; font-weight: 800; font-size: 0.95rem; color: #D97706; margin-bottom: 6px;">TOP ${item.rank}</div>
                            <div class="team-names">${item.p1 || '-'} & ${item.p2 || '-'}</div>
                            <div class="trainer-ids">ID: ${item.id1 || '-'} | ${item.id2 || '-'}</div>
                            <div class="top-score">${item.score.toLocaleString('vi-VN')}</div>
                        </div>
                    `;
                }
            });

            podiumEl.innerHTML = html;
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboardBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 25px;">Chưa có dữ liệu xếp hạng.</td></tr>';
                return;
            }

            let html = '';
            data.forEach(item => {
                let badgeClass = 'rank-badge';
                if (item.rank === 1) badgeClass += ' rank-1-badge';
                else if (item.rank === 2) badgeClass += ' rank-2-badge';
                else if (item.rank === 3) badgeClass += ' rank-3-badge';

                html += `
                    <tr>
                        <td style="text-align: center;"><span class="${badgeClass}">${item.rank}</span></td>
                        <td>
                            <div class="player-info">
                                <span class="player-name">${item.p1 || '-'}</span>
                                <span class="trainer-id">${item.id1 ? 'ID: ' + item.id1 : ''}</span>
                            </div>
                        </td>
                        <td>
                            <div class="player-info">
                                <span class="player-name">${item.p2 || '-'}</span>
                                <span class="trainer-id">${item.id2 ? 'ID: ' + item.id2 : ''}</span>
                            </div>
                        </td>
                        <td><span class="time-badge"><i class="fa-regular fa-clock"></i> ${item.time}</span></td>
                        <td style="text-align: right;"><span class="score-val">${item.score.toLocaleString('vi-VN')}</span></td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function filterLeaderboard() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderLeaderboard(rawLeaderboardData);
                return;
            }

            const filtered = rawLeaderboardData.filter(item => 
                item.p1.toLowerCase().includes(query) ||
                item.p2.toLowerCase().includes(query) ||
                item.id1.toString().toLowerCase().includes(query) ||
                item.id2.toString().toLowerCase().includes(query)
            );

            renderLeaderboard(filtered);
        }

        fetchRankingData();
        setInterval(fetchRankingData, 10000);
    </script>
</body>
</html>
