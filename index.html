<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon MEZASTAR - Bảng Xếp Hạng Trực Tiếp</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Tông màu chuẩn Logo MEZASTAR */
            --mezastar-red: #E60012;
            --mezastar-gold: #FFC700;
            --mezastar-gold-dark: #FF9100;
            --bg-dark: #050814;
            --bg-card: rgba(13, 20, 41, 0.85);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --accent-blue: #00D2FF;
            --neon-glow: rgba(255, 199, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(230, 0, 18, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 10% 40%, rgba(0, 210, 255, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(255, 199, 0, 0.15) 0%, transparent 45%),
                linear-gradient(180deg, #050814 0%, #0a1128 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HEADER & POKEMON BANNER */
        header {
            text-align: center;
            padding: 20px 0 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-content {
            z-index: 2;
        }

        .header-pokemon {
            position: absolute;
            width: 140px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 199, 0, 0.6));
            animation: float 4s ease-in-out infinite;
            z-index: 1;
        }

        .header-pokemon.left {
            left: 20px;
            top: -10px;
        }

        .header-pokemon.right {
            right: 20px;
            top: -10px;
            animation-delay: 2s;
            transform: scaleX(-1);
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(180deg, #FFFFFF 0%, #FFF500 45%, #FF9100 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            filter: drop-shadow(0 0 18px rgba(255, 199, 0, 0.8));
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
        }

        /* STATUS BAR WITH GLOW */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 199, 0, 0.4);
            padding: 12px 24px;
            border-radius: 50px;
            margin: 25px 0 35px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 199, 0, 0.1);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--mezastar-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(230, 0, 18, 0.6);
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background-color: var(--mezastar-red);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--mezastar-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(230, 0, 18, 0.8); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(230, 0, 18, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(230, 0, 18, 0); }
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--mezastar-gold);
            box-shadow: 0 0 15px rgba(255, 199, 0, 0.6);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* PODIUM TOP 3 WITH POKEMON & GLOW EFFECTS */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 25px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .top-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px 20px 20px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(12px);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            width: 300px;
        }

        /* CARD TOP 1 - HIGHLIGHT NEON GLOW */
        .top-card.rank-1 {
            border-color: var(--mezastar-gold);
            background: linear-gradient(180deg, rgba(255, 199, 0, 0.2) 0%, rgba(13, 20, 41, 0.95) 100%);
            animation: goldGlow 3s infinite alternate;
            order: 2;
            transform: scale(1.08);
            z-index: 3;
        }

        .top-card.rank-2 {
            border-color: #C0C0C0;
            background: linear-gradient(180deg, rgba(192, 192, 192, 0.15) 0%, rgba(13, 20, 41, 0.95) 100%);
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.3);
            order: 1;
        }

        .top-card.rank-3 {
            border-color: #CD7F32;
            background: linear-gradient(180deg, rgba(205, 127, 50, 0.15) 0%, rgba(13, 20, 41, 0.95) 100%);
            box-shadow: 0 0 20px rgba(205, 127, 50, 0.3);
            order: 3;
        }

        @keyframes goldGlow {
            0% { box-shadow: 0 0 20px rgba(255, 199, 0, 0.4), inset 0 0 10px rgba(255, 199, 0, 0.2); }
            100% { box-shadow: 0 0 40px rgba(255, 199, 0, 0.8), inset 0 0 20px rgba(255, 199, 0, 0.4); }
        }

        /* POKEMON ON TOP CARDS */
        .card-pokemon-img {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            height: 90px;
            width: auto;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.7));
            animation: float 3s ease-in-out infinite;
        }

        .crown-icon {
            font-size: 2.2rem;
            margin-top: 25px;
            margin-bottom: 6px;
        }

        .rank-1 .crown-icon { color: var(--mezastar-gold); filter: drop-shadow(0 0 10px var(--mezastar-gold)); }
        .rank-2 .crown-icon { color: #C0C0C0; filter: drop-shadow(0 0 8px #C0C0C0); }
        .rank-3 .crown-icon { color: #CD7F32; filter: drop-shadow(0 0 8px #CD7F32); }

        .team-names {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 6px;
            color: #FFF;
        }

        .trainer-ids {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .top-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--mezastar-gold);
            text-shadow: 0 0 12px rgba(255, 199, 0, 0.8);
        }

        /* LEADERBOARD TABLE GLOW */
        .table-container {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 199, 0, 0.3);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 210, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.6);
            font-family: 'Orbitron', sans-serif;
            color: var(--mezastar-gold);
            padding: 18px 16px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(255, 199, 0, 0.4);
            text-shadow: 0 0 8px rgba(255, 199, 0, 0.5);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(255, 199, 0, 0.08);
            transition: background 0.2s;
        }

        .rank-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            display: inline-block;
            width: 38px;
            height: 38px;
            line-height: 38px;
            text-align: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .rank-1-badge { background: var(--mezastar-gold); color: #000; box-shadow: 0 0 15px var(--mezastar-gold); }
        .rank-2-badge { background: #C0C0C0; color: #000; box-shadow: 0 0 10px #C0C0C0; }
        .rank-3-badge { background: #CD7F32; color: #FFF; box-shadow: 0 0 10px #CD7F32; }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-weight: 600;
            color: #FFF;
        }

        .trainer-id {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .time-badge {
            background: rgba(0, 210, 255, 0.12);
            color: var(--accent-blue);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
        }

        .score-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--mezastar-gold);
            text-shadow: 0 0 8px rgba(255, 199, 0, 0.5);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--mezastar-gold);
        }

        /* ANIMATIONS */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 900px) {
            .header-pokemon { display: none; }
            .podium-container { flex-direction: column; align-items: center; margin-top: 60px; }
            .top-card.rank-1 { order: 1; transform: scale(1); }
            .top-card.rank-2 { order: 2; }
            .top-card.rank-3 { order: 3; }
            .status-bar { flex-direction: column; gap: 15px; border-radius: 20px; }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER WITH POKEMON ARTWORK -->
        <header>
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1007.png" class="header-pokemon left" alt="Koraidon">
            <div class="header-content">
                <h1 class="logo-title"><i class="fa-solid fa-star"></i> POKÉMON MEZASTAR <i class="fa-solid fa-star"></i></h1>
                <div class="subtitle">BẢNG XẾP HẠNG TAG BATTLE CHALLENGE</div>
            </div>
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1008.png" class="header-pokemon right" alt="Miraidon">
        </header>

        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="live-badge">
                <div class="pulse-dot"></div>
                <span>Trực Tiếp • Cập nhật tự động</span>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm tên người chơi hoặc Trainer ID..." onkeyup="filterLeaderboard()">
            </div>
            <div id="lastUpdated" style="font-size: 0.85rem; color: var(--text-muted);">
                Đang kết nối...
            </div>
        </div>

        <!-- TOP 3 PODIUM WITH POKEMON MASCOTS -->
        <div class="podium-container" id="podium"></div>

        <!-- FULL LEADERBOARD TABLE -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px; text-align: center;">HẠNG</th>
                        <th>NGƯỜI CHƠI 1</th>
                        <th>NGƯỜI CHƠI 2</th>
                        <th style="width: 140px;">KHUNG GIỜ</th>
                        <th style="width: 140px; text-align: right;">ĐIỂM SỐ</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr>
                        <td colspan="5" class="loading">
                            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải bảng xếp hạng...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = '1y8gL7yJTViGX33N5PO0ggpXG94uEPVdjFkBQDNh7b54';
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;

        let rawLeaderboardData = [];

        // HÀM CHUYỂN ĐỔI THỜI GIAN
        function formatSheetTime(cell) {
            if (!cell) return '-';
            if (cell.f) return cell.f;
            
            const val = cell.v;
            if (!val) return '-';

            if (typeof val === 'string') {
                const dateMatch = val.match(/Date\(\d+,\d+,\d+,(\d+),(\d+)/);
                if (dateMatch) {
                    const hours = dateMatch[1].padStart(2, '0');
                    const mins = dateMatch[2].padStart(2, '0');
                    return `${hours}:${mins}`;
                }
                return val;
            }
            return String(val);
        }

        async function fetchRankingData() {
            try {
                const response = await fetch(GVIZ_URL);
                const text = await response.text();
                
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                
                const rows = data.table.rows;
                let parsedData = [];

                rows.forEach(row => {
                    const cells = row.c;
                    if (!cells) return;

                    const p1 = cells[1] ? (cells[1].v || '') : '';
                    const id1 = cells[2] ? (cells[2].v || '') : '';
                    const p2 = cells[3] ? (cells[3].v || '') : '';
                    const id2 = cells[4] ? (cells[4].v || '') : '';
                    const time = formatSheetTime(cells[5]);
                    const scoreRaw = cells[6] ? cells[6].v : 0;
                    const score = parseFloat(scoreRaw) || 0;

                    if (p1.toString().trim() !== '' || p2.toString().trim() !== '') {
                        parsedData.push({ p1, id1, p2, id2, time, score });
                    }
                });

                // TỰ ĐỘNG SẮP XẾP THEO ĐIỂM SỐ GIẢM DẦN
                parsedData.sort((a, b) => b.score - a.score);

                // ĐÁNH RANK TỰ ĐỘNG
                parsedData.forEach((item, index) => {
                    item.rank = index + 1;
                });

                rawLeaderboardData = parsedData;
                renderPodium(parsedData.slice(0, 3));
                renderLeaderboard(parsedData);
                
                const now = new Date();
                document.getElementById('lastUpdated').innerText = `Cập nhật: ${now.toLocaleTimeString('vi-VN')}`;

            } catch (error) {
                console.error("Lỗi kết nối Google Sheet:", error);
            }
        }

        // VẼ PODIUM TOP 3 KÈM HÌNH POKÉMON DỄ THƯƠNG
        function renderPodium(top3) {
            const podiumEl = document.getElementById('podium');
            if (!top3 || top3.length === 0) {
                podiumEl.innerHTML = '';
                return;
            }

            let html = '';
            const crowns = ['fa-crown', 'fa-medal', 'fa-award'];
            const classes = ['rank-1', 'rank-2', 'rank-3'];
            
            // Hình ảnh Pokémon cho Top 1, Top 2, Top 3
            const pokeImgs = [
                'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png',   /* Charizard cho Top 1 */
                'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/448.png', /* Lucario cho Top 2 */
                'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png'   /* Pikachu cho Top 3 */
            ];

            const displayOrder = [1, 0, 2]; // Đổi thứ tự hiển thị Podium: Top 2 -> Top 1 -> Top 3

            displayOrder.forEach(idx => {
                if (top3[idx]) {
                    const item = top3[idx];
                    html += `
                        <div class="top-card ${classes[idx]}">
                            <img src="${pokeImgs[idx]}" class="card-pokemon-img" alt="Pokemon">
                            <i class="fa-solid ${crowns[idx]} crown-icon"></i>
                            <div style="font-family: Orbitron; font-weight: 800; font-size: 0.95rem; color: var(--mezastar-gold); margin-bottom: 6px;">TOP ${item.rank}</div>
                            <div class="team-names">${item.p1 || '-'} & ${item.p2 || '-'}</div>
                            <div class="trainer-ids">ID: ${item.id1 || '-'} | ${item.id2 || '-'}</div>
                            <div class="top-score">${item.score.toLocaleString('vi-VN')}</div>
                        </div>
                    `;
                }
            });

            podiumEl.innerHTML = html;
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboardBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 25px;">Chưa có dữ liệu xếp hạng.</td></tr>';
                return;
            }

            let html = '';
            data.forEach(item => {
                let badgeClass = 'rank-badge';
                if (item.rank === 1) badgeClass += ' rank-1-badge';
                else if (item.rank === 2) badgeClass += ' rank-2-badge';
                else if (item.rank === 3) badgeClass += ' rank-3-badge';

                html += `
                    <tr>
                        <td style="text-align: center;"><span class="${badgeClass}">${item.rank}</span></td>
                        <td>
                            <div class="player-info">
                                <span class="player-name">${item.p1 || '-'}</span>
                                <span class="trainer-id">${item.id1 ? 'ID: ' + item.id1 : ''}</span>
                            </div>
                        </td>
                        <td>
                            <div class="player-info">
                                <span class="player-name">${item.p2 || '-'}</span>
                                <span class="trainer-id">${item.id2 ? 'ID: ' + item.id2 : ''}</span>
                            </div>
                        </td>
                        <td><span class="time-badge"><i class="fa-regular fa-clock"></i> ${item.time}</span></td>
                        <td style="text-align: right;"><span class="score-val">${item.score.toLocaleString('vi-VN')}</span></td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function filterLeaderboard() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderLeaderboard(rawLeaderboardData);
                return;
            }

            const filtered = rawLeaderboardData.filter(item => 
                item.p1.toLowerCase().includes(query) ||
                item.p2.toLowerCase().includes(query) ||
                item.id1.toString().toLowerCase().includes(query) ||
                item.id2.toString().toLowerCase().includes(query)
            );

            renderLeaderboard(filtered);
        }

        fetchRankingData();
        setInterval(fetchRankingData, 10000);
    </script>
</body>
</html>
